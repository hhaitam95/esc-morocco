name: ESC opportunity cache

on:
  schedule:
    # Every hour at minute 17.
    - cron: "17 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: esc-opportunity-cache
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scraper dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4 pycountry

      - name: Validate scraper syntax
        run: |
          python -m py_compile scraper/scraper.py

      - name: Run ESC scraper
        run: |
          python scraper/scraper.py

      - name: Show generated cache
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/opportunities.json")

          data = json.loads(
              path.read_text(encoding="utf-8")
          )

          print(
              f"Published opportunities: "
              f"{data.get('count', 0)}"
          )

          print(
              f"Participant countries: "
              f"{len(data.get('participant_countries', []))}"
          )

          print(
              f"Scan complete: "
              f"{data.get('scan_complete')}"
          )
          PY

      - name: Check generated files
        run: |
          test -s data/opportunities.json
          test -s web/opportunities.json
          test -s data/checkpoint.json
          test -s data/expired.json

      - name: Commit cache changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/opportunities.json \
            data/checkpoint.json \
            data/expired.json \
            web/opportunities.json

          if git diff --cached --quiet; then
            echo "No cache changes to commit."
            exit 0
          fi

          git commit -m "chore: update ESC opportunity cache"

          git push
