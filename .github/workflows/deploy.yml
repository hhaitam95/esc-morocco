name: Deploy ESC Website

on:
  push:
    paths:
      - "web/**"
      - ".github/workflows/deploy.yml"
  workflow_run:
    workflows:
      - "Update ESC Opportunities"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.name == 'Update ESC Opportunities'
      )

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout current main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Validate published data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          opportunities_path = Path("data/opportunities.json")
          expired_path = Path("data/expired.json")

          if not opportunities_path.exists():
              raise SystemExit("ERROR: data/opportunities.json is missing.")

          if not expired_path.exists():
              raise SystemExit("ERROR: data/expired.json is missing.")

          opportunities = json.loads(
              opportunities_path.read_text(encoding="utf-8")
          )
          expired = json.loads(
              expired_path.read_text(encoding="utf-8")
          )

          if not isinstance(opportunities, dict):
              raise SystemExit("ERROR: data/opportunities.json must be an object.")

          if not isinstance(expired, dict):
              raise SystemExit("ERROR: data/expired.json must be an object.")

          active = opportunities.get("opportunities")
          archived = expired.get("opportunities")
          generated_at = opportunities.get("generated_at")

          if not isinstance(active, list) or not active:
              raise SystemExit("ERROR: active opportunity dataset is empty or invalid.")

          if not isinstance(archived, list):
              raise SystemExit("ERROR: expired opportunity dataset is invalid.")

          if not generated_at:
              raise SystemExit("ERROR: active dataset has no generated_at timestamp.")

          declared_active = opportunities.get("count")
          declared_expired = expired.get("count")

          if declared_active != len(active):
              raise SystemExit(
                  f"ERROR: active count mismatch: metadata={declared_active}, records={len(active)}."
              )

          if declared_expired != len(archived):
              raise SystemExit(
                  f"ERROR: expired count mismatch: metadata={declared_expired}, records={len(archived)}."
              )

          print(f"PASS: active opportunities: {len(active)}")
          print(f"PASS: expired opportunities: {len(archived)}")
          print(f"PASS: last updated: {generated_at}")
          print("PASS: published data is valid.")
          PY

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web

      - name: Deploy ESC Website
        id: deployment
        uses: actions/deploy-pages@v4
