name: Update ESC Morocco Opportunities

on:
  # Automatic daily refresh.
  schedule:
    - cron: "0 8 * * *"

  # Allows you to manually run the workflow from GitHub.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-opportunities:
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------
      # Python
      # ------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ------------------------------------------------------
      # Dependencies
      # ------------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      # ------------------------------------------------------
      # Run scraper
      #
      # Exit code 2 = rate limited, but progress was saved.
      # Exit code 1 = actual error.
      # ------------------------------------------------------

      - name: Run scraper
        id: scraper
        continue-on-error: true
        run: |
          set +e
          python scraper/scraper.py
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          exit $EXIT_CODE

      # ------------------------------------------------------
      # Commit all persistent data changes
      #
      # We intentionally do NOT commit an API cache.
      # The scraper fetches a fresh API list every run.
      # ------------------------------------------------------

      - name: Commit updated data
        if: always()
        run: |
          if [ -n "$(git status --porcelain)" ]; then

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add data/opportunities.json
            git add data/expired.json
            git add data/checkpoint.json

            git commit -m "Update ESC Morocco opportunities"

            git push

          else
            echo "No data changes to commit."
          fi

      # ------------------------------------------------------
      # Fail the workflow for genuine errors.
      #
      # Exit code 2 means rate-limited/resumable and is allowed.
      # ------------------------------------------------------

      - name: Check scraper result
        if: always()
        run: |
          EXIT_CODE="${{ steps.scraper.outputs.exit_code }}"

          if [ "$EXIT_CODE" = "1" ]; then
            echo "Scraper failed with a genuine error."
            exit 1
          fi

          if [ "$EXIT_CODE" = "2" ]; then
            echo "Scraper was rate-limited."
            echo "Checkpoint was preserved and committed."
            exit 0
          fi

          echo "Scraper completed successfully."