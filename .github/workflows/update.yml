name: Update ESC Opportunities

on:
  # Run automatically every hour.
  schedule:
    - cron: "0 * * * *"

  # Allow manual runs from GitHub Actions.
  workflow_dispatch:

permissions:
  contents: write

# Prevent two scraper runs from modifying the same checkpoint
# simultaneously.
concurrency:
  group: esc-morocco-updater
  cancel-in-progress: false

jobs:
  update-opportunities:
    runs-on: ubuntu-latest

    # Ten 40-item batches can take a while because of the
    # deliberate request delay.
    timeout-minutes: 90

    steps:
      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ======================================================
      # PYTHON
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ======================================================
      # DEPENDENCIES
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      # ======================================================
      # GIT CONFIGURATION
      # ======================================================

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # ======================================================
      # RUN SCRAPER BATCHES
      #
      # One scraper invocation:
      #   maximum 40 detail pages
      #
      # One workflow run:
      #   maximum 10 batches
      #   = maximum 400 detail pages
      #
      # Exit codes:
      #   0 = normal batch completion
      #   1 = genuine scraper failure
      #   2 = rate-limited / safely paused
      # ======================================================

      - name: Run scraper batches
        id: scraper
        continue-on-error: true
        run: |

          set +e

          MAX_BATCHES=10
          BATCH=1
          OVERALL_EXIT_CODE=0

          while [ "$BATCH" -le "$MAX_BATCHES" ]; do

            echo ""
            echo "======================================================"
            echo "STARTING SCRAPER BATCH $BATCH / $MAX_BATCHES"
            echo "======================================================"
            echo ""

            python scraper/scraper.py

            EXIT_CODE=$?

            echo ""
            echo "Batch $BATCH exit code: $EXIT_CODE"
            echo ""

            # ------------------------------------------------
            # Publish latest generated JSON to the website.
            # ------------------------------------------------

            if [ -f data/opportunities.json ]; then
              python - <<'PY'
import json

with open(
    "data/opportunities.json",
    "r",
    encoding="utf-8",
) as file:
    data = json.load(file)

if data.get("migration_complete") is True:
    raise SystemExit(0)

raise SystemExit(1)
PY
              if [ $? -eq 0 ]; then
                cp data/opportunities.json web/opportunities.json
                echo "Published complete country-neutral dataset."
              else
                echo "Migration incomplete; keeping published dataset."
              fi
            fi

            if [ -f data/expired.json ]; then
              cp data/expired.json web/expired.json
            fi

            # ------------------------------------------------
            # Commit this batch immediately.
            # ------------------------------------------------

            if [ -n "$(git status --porcelain)" ]; then

              git add data/opportunities.json
              git add data/expired.json
              git add data/checkpoint.json

              git add web/opportunities.json
              git add web/expired.json

              git commit \
                -m "Update ESC opportunities"

              git push

            else

              echo "No repository changes after batch."

            fi

            # ------------------------------------------------
            # Genuine failure.
            # ------------------------------------------------

            if [ "$EXIT_CODE" -eq 1 ]; then

              echo ""
              echo "Genuine scraper error."
              echo "Stopping workflow."
              echo ""

              OVERALL_EXIT_CODE=1

              break

            fi

            # ------------------------------------------------
            # Rate-limited / safely paused.
            # ------------------------------------------------

            if [ "$EXIT_CODE" -eq 2 ]; then

              echo ""
              echo "Rate limit detected."
              echo "Stopping remaining batches."
              echo "Completed progress was committed."
              echo ""

              OVERALL_EXIT_CODE=2

              break

            fi

            # ------------------------------------------------
            # Normal completion.
            # ------------------------------------------------

            BATCH=$((BATCH + 1))

          done

          echo "exit_code=$OVERALL_EXIT_CODE" \
            >> "$GITHUB_OUTPUT"

          exit "$OVERALL_EXIT_CODE"

      # ======================================================
      # FINAL STATUS
      # ======================================================

      - name: Check scraper result
        if: always()
        run: |

          EXIT_CODE="${{ steps.scraper.outputs.exit_code }}"

          if [ "$EXIT_CODE" = "1" ]; then

            echo "Scraper encountered a genuine error."

            exit 1

          elif [ "$EXIT_CODE" = "2" ]; then

            echo "Scraper was rate-limited."

            echo "Completed batches were committed."

            # Rate limiting is expected and resumable.
            exit 0

          else

            echo "All scheduled scraper batches completed successfully."

          fi
