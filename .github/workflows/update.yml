name: Update ESC Opportunities

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: esc-opportunity-update
  cancel-in-progress: false

jobs:
  update:
    name: Scrape and save ESC opportunities
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scraper dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pycountry requests beautifulsoup4

      - name: Verify scraper dependencies
        run: |
          python - <<'PY'
          import pycountry
          import requests
          from bs4 import BeautifulSoup

          print(f"PASS: pycountry {getattr(pycountry, '__version__', 'installed')}")
          print(f"PASS: requests {requests.__version__}")
          print(f"PASS: beautifulsoup4 import available ({BeautifulSoup.__name__})")
          PY

      - name: Run ESC scraper
        run: |
          python scraper/scraper.py

      - name: Validate saved data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          opportunities_path = Path("data/opportunities.json")
          expired_path = Path("data/expired.json")

          if not opportunities_path.exists():
              raise SystemExit("ERROR: data/opportunities.json was not created.")

          data = json.loads(
              opportunities_path.read_text(encoding="utf-8")
          )

          if not isinstance(data, dict):
              raise SystemExit(
                  "ERROR: data/opportunities.json must contain an object."
              )

          opportunities = data.get("opportunities")

          if not isinstance(opportunities, list):
              raise SystemExit(
                  "ERROR: data/opportunities.json has no opportunities list."
              )

          if not opportunities:
              raise SystemExit(
                  "ERROR: scraper produced an empty opportunities list."
              )

          if expired_path.exists():
              expired = json.loads(
                  expired_path.read_text(encoding="utf-8")
              )
              if not isinstance(expired, dict):
                  raise SystemExit(
                      "ERROR: data/expired.json must contain an object."
                  )

          print(
              f"PASS: saved {len(opportunities)} current opportunities."
          )
          print("PASS: canonical JSON data is valid.")
          PY

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- data/opportunities.json
          git add -- data/expired.json
          git add -- data/checkpoint.json

          if git diff --cached --quiet; then
            echo "No data changes detected."
            exit 0
          fi

          git diff --cached --check

          git commit -m "chore: update ESC opportunities"
          git push origin main

          echo "ESC data updated and pushed."
          echo "The push to main triggers deploy.yml."
