name: Update ESC Morocco Opportunities

on:
  # Automatic daily refresh at 08:00 UTC.
  schedule:
    - cron: "0 8 * * *"

  # Manual run from GitHub Actions.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-opportunities:
    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ======================================================
      # PYTHON
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ======================================================
      # DEPENDENCIES
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4


      # ======================================================
      # GIT CONFIGURATION
      # ======================================================

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


      # ======================================================
      # RUN SCRAPER BATCHES
      #
      # Each Python invocation handles at most 40 detail pages.
      #
      # Maximum:
      #   3 batches × 40 = 120 detail pages
      #
      # Exit code:
      #   0 = batch completed normally
      #   1 = genuine failure
      #   2 = rate limited / safely paused
      # ======================================================

      - name: Run scraper batches
        id: scraper
        continue-on-error: true
        run: |

          set +e

          MAX_BATCHES=3
          BATCH=1
          OVERALL_EXIT_CODE=0

          while [ "$BATCH" -le "$MAX_BATCHES" ]; do

            echo ""
            echo "======================================================"
            echo "STARTING SCRAPER BATCH $BATCH / $MAX_BATCHES"
            echo "======================================================"
            echo ""

            python scraper/scraper.py

            EXIT_CODE=$?

            echo ""
            echo "Batch $BATCH exit code: $EXIT_CODE"
            echo ""

            # ------------------------------------------------
            # Publish latest JSON files into the website.
            # ------------------------------------------------

            if [ -f data/opportunities.json ]; then
              cp data/opportunities.json web/opportunities.json
            fi

            if [ -f data/expired.json ]; then
              cp data/expired.json web/expired.json
            fi

            # ------------------------------------------------
            # Commit everything produced by this batch.
            # ------------------------------------------------

            if [ -n "$(git status --porcelain)" ]; then

              git add data/opportunities.json
              git add data/expired.json
              git add data/checkpoint.json

              git add web/opportunities.json
              git add web/expired.json

              git commit \
                -m "Update ESC Morocco opportunities"

              git push

            else

              echo "No repository changes after batch."

            fi

            # ------------------------------------------------
            # Genuine scraper error.
            # ------------------------------------------------

            if [ "$EXIT_CODE" -eq 1 ]; then

              echo ""
              echo "Genuine scraper error."
              echo ""

              OVERALL_EXIT_CODE=1

              break

            fi

            # ------------------------------------------------
            # Rate limited.
            #
            # The scraper has already saved its checkpoint.
            # Stop further batches to avoid making the
            # situation worse.
            # ------------------------------------------------

            if [ "$EXIT_CODE" -eq 2 ]; then

              echo ""
              echo "Rate limit detected."
              echo "Stopping further batches."
              echo "Completed progress was committed."
              echo ""

              OVERALL_EXIT_CODE=2

              break

            fi

            # ------------------------------------------------
            # Normal batch completion.
            # ------------------------------------------------

            BATCH=$((BATCH + 1))

          done

          echo "exit_code=$OVERALL_EXIT_CODE" \
            >> "$GITHUB_OUTPUT"

          exit "$OVERALL_EXIT_CODE"


      # ======================================================
      # FINAL STATUS
      # ======================================================

      - name: Check scraper result
        if: always()
        run: |

          EXIT_CODE="${{ steps.scraper.outputs.exit_code }}"

          if [ "$EXIT_CODE" = "1" ]; then

            echo "Scraper encountered a genuine error."

            exit 1

          elif [ "$EXIT_CODE" = "2" ]; then

            echo "Scraper was rate-limited."

            echo "Checkpoint and completed data were committed."

            # Rate limiting is an expected resumable condition.
            exit 0

          else

            echo "All scraper batches completed successfully."

          fi