name: Update ESC Morocco Opportunities

on:
  schedule:
    # Every day at 08:00 UTC.
    - cron: "0 8 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-opportunities:
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------
      # Python
      # ------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ------------------------------------------------------
      # Dependencies
      # ------------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      # ------------------------------------------------------
      # Run ONE bounded scraper batch
      # ------------------------------------------------------

      - name: Run scraper batch
        id: scraper
        continue-on-error: true
        run: |
          set +e

          python scraper/scraper.py

          EXIT_CODE=$?

          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

          exit $EXIT_CODE

      # ------------------------------------------------------
      # Commit checkpoint + public data
      #
      # This happens even if the scraper stopped because
      # of a 429.
      # ------------------------------------------------------

      - name: Commit updated data
        if: always()
        run: |
          if [ -n "$(git status --porcelain)" ]; then

            git config user.name "github-actions[bot]"

            git config user.email \
              "41898282+github-actions[bot]@users.noreply.github.com"

            git add data/opportunities.json
            git add data/expired.json
            git add data/checkpoint.json

            git commit \
              -m "Update ESC Morocco opportunities"

            git push

          else

            echo "No data changes to commit."

          fi

      # ------------------------------------------------------
      # Report result
      # ------------------------------------------------------

      - name: Check scraper result
        if: always()
        run: |

          EXIT_CODE="${{ steps.scraper.outputs.exit_code }}"

          if [ "$EXIT_CODE" = "1" ]; then

            echo "Scraper encountered a genuine error."

            exit 1

          elif [ "$EXIT_CODE" = "2" ]; then

            echo "Scraper paused because of rate limiting."
            echo "Checkpoint was committed successfully."

            exit 0

          else

            echo "Scraper batch completed successfully."

          fi